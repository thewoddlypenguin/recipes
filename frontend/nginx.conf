server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip for common text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # Uploaded media -> backend static mount
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 25m;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------------
    # Sub-path deployments (e.g. justinmikkelsen.com/recipes-staging/).
    #
    # The recommended host proxy strips the prefix before forwarding
    # (/recipes-staging/api/x -> container /api/x), so the locations above
    # handle everything. The locations below make the container ALSO work
    # behind a non-stripping host proxy: they accept the prefixed paths
    # directly and rewrite to the backend / SPA assets.
    # ------------------------------------------------------------------
    location /recipes-staging/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    location /recipes-staging/uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        client_max_body_size 25m;
    }

    location /recipes-staging/assets/ {
        alias /usr/share/nginx/html/assets/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for sub-path deployments (e.g. /recipes-staging/).
    # Serves static files when they exist, falls back to index.html for
    # all client-side routes so deep-link refreshes work.
    location /recipes-staging/ {
        try_files $uri $uri/ /index.html;
    }